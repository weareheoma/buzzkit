name: Update news
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["posts.txt", "hide.txt", "build.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python build.py
      - name: Save the site
        run: |
          git config user.name "habari-bot"
          git config user.email "habari-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update news"
          git push
